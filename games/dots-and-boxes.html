<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dots &amp; Boxes — Twogether</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⬜</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .board-wrap { display: flex; justify-content: center; width: 100%; overflow-x: auto; padding: 6px; }
  .board {
    display: grid;
    gap: 0;
  }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink);
    align-self: center; justify-self: center;
  }
  .line {
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    position: relative;
  }
  .line::after {
    content: '';
    position: absolute;
    border-radius: 6px;
    background: #cbbfe0;
    transition: background 0.1s ease;
  }
  .h-line::after { inset: 40% 4px; }
  .v-line::after { inset: 4px 40%; }
  .line:not(:disabled):hover::after { background: #9c88bf; }
  .line.filled.p1::after { background: var(--p1); }
  .line.filled.p2::after { background: var(--p2); }
  .line:disabled { cursor: default; }
  .box {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 800; font-size: 1.4rem;
    border-radius: 6px;
    color: transparent;
  }
  .box.p1 { background: rgba(255, 197, 61, 0.5); color: var(--ink); }
  .box.p2 { background: rgba(255, 107, 107, 0.4); color: var(--ink); }

  .turn-banner {
    text-align: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.15rem;
  }

  .overlay {
    position: fixed; inset: 0;
    background: var(--bg-deep);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  .spinner {
    width: 44px; height: 44px;
    border: 5px solid rgba(255,244,227,0.25);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <p id="overlay-text">Reconnecting you to the room…</p>
</div>

<div class="page">
  <div class="topbar">
    <a class="brand" href="../lobby.html"><span class="brand-badge">⬜</span> Dots &amp; Boxes</a>
    <span class="room-code" id="room-code" style="font-size:1rem; padding:6px 14px;">-----</span>
  </div>

  <main>
    <div class="scoreboard">
      <div class="score-chip me">
        <div class="label" id="me-label">You</div>
        <div class="value" id="me-score">0</div>
      </div>
      <div class="score-chip opp">
        <div class="label" id="opp-label">Friend</div>
        <div class="value" id="opp-score">0</div>
      </div>
    </div>

    <div class="turn-banner" id="turn-banner">Your turn</div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div id="game-over" class="card center stack hidden">
      <h2 id="result-heading">You win! 🎉</h2>
      <p id="result-sub" class="muted-text" style="color:#6b5c80;"></p>
      <button class="btn btn-primary" id="play-again-btn">Play again</button>
    </div>

    <a class="btn btn-ghost btn-sm" href="../lobby.html">← Back to lobby</a>
  </main>
</div>

<script type="module" src="dots-and-boxes.js"></script>
</body>
</html>
